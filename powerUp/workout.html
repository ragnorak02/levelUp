<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Power Up! — Today</title>
<style>
  :root{
    --bg:#080c11; --panel:#0d131a; --ink:#e8eef6; --muted:#9fb0c7; --ring:#1c2a37;
    --accent:#4CAF50; --danger:#ef4444; --warn:#f59e0b;
    --finished-bg:#0e141b; --finished-ring:#1c2a37;
    --orange:#ff9500; --orange-bg:#2a1f0a;

    --power-glow:#1e3a8a;
    --power-grad: linear-gradient(90deg,#0b1118, #0b1118);
    
    --copied-bg:#1a1f2b; --copied-ring:#2a3447; --copied-text:#22c55e;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Arial;
    background:linear-gradient(180deg,#070b10 0%, #0a1016 100%); color:var(--ink);
    display:flex; flex-direction:column;
  }

  /* Header scrolls away with the page — it is not sticky. Only the compact
     totals strip stays pinned, so nothing can overlap the action buttons. */
  header{
    background: linear-gradient(180deg, rgba(11,15,20,.95), rgba(11,15,20,.75));
    border-bottom:1px solid var(--ring); color:var(--ink); padding:8px 10px;
  }
  .bar{display:flex; align-items:center; gap:7px}
  .icon-btn{
    all:unset; cursor:pointer; flex:0 0 auto;
    width:38px; height:38px; border:1px solid var(--ring); border-radius:10px;
    display:inline-flex; align-items:center; justify-content:center;
    font-size:1.05rem; line-height:1;
  }
  .icon-btn:active{background:#16202b}
  .brand{flex:0 0 auto; font-size:1.15rem; line-height:1}

  .date-nav{display:flex; align-items:center; gap:4px; flex:1 1 auto; min-width:0}
  .date-nav button{
    all:unset; cursor:pointer; flex:0 0 auto;
    width:32px; height:34px; border:1px solid var(--ring); border-radius:9px;
    display:inline-flex; align-items:center; justify-content:center;
  }
  .date-nav button:active{background:#16202b}
  .date-str{
    flex:1 1 auto; min-width:0; text-align:center; font-weight:900;
    font-size:.92rem; letter-spacing:.02em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  header .actions{margin-top:8px}

  /* Section heading + expand/collapse-all controls */
  .sg-head{display:flex; align-items:center; gap:8px; margin:.2rem 0 .5rem}
  .sg-head h2{margin:0; font-size:1rem; color:#c7d2fe; flex:1 1 auto; min-width:0}
  .sg-actions{display:flex; gap:6px; flex:0 0 auto}
  .mini-btn{
    all:unset; cursor:pointer; white-space:nowrap;
    font-size:.72rem; font-weight:800; color:var(--muted);
    border:1px solid var(--ring); background:#0e141b;
    padding:.34rem .6rem; border-radius:999px;
    min-height:30px; display:inline-flex; align-items:center;
  }
  .mini-btn:active{background:#16202b; color:var(--ink)}

  .wrap{width:min(900px,100%); margin-inline:auto; padding:10px; display:flex; flex-direction:column; gap:10px; flex:1}

  .card{
    background:var(--panel);
    border:1px solid rgba(42,53,67,.70);
    border-radius:16px; padding:12px;
    box-shadow:0 4px 20px rgba(0,0,0,.20);
  }
  #powerCard{
    position:relative;
    overflow:hidden;
    box-shadow:
      0 0 0 1px color-mix(in oklab, var(--power-glow), #000 60%),
      0 0 24px color-mix(in oklab, var(--power-glow), #000 10%),
      inset 0 0 28px color-mix(in oklab, var(--power-glow), #000 75%);
    outline: 1px solid color-mix(in oklab, var(--power-glow), #000 60%);
  }
  #powerCard::after{
    content:"";
    position:absolute; inset:-1px;
    background: var(--power-grad);
    background-size: 300% 100%;
    opacity:0; pointer-events:none;
  }
  .level-up #powerCard::after{
    animation: sweep 650ms ease-out;
  }
  @keyframes sweep{
    0%{opacity:.0; background-position: -200% 0}
    20%{opacity:.25}
    50%{opacity:.35}
    100%{opacity:0; background-position: 200% 0}
  }

  #powerCard .top{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
  #powerVal{font-size:2rem; font-weight:900; line-height:1}
  #powerTrend{font-size:.85rem; color:var(--muted); font-weight:700}
  #powerTrend.up{color:#4ade80}
  #powerTrend.down{color:#94a3b8}

  /* ===== Session summary panel ===== */
  .sess-label{
    margin:0 0 .3rem; color:var(--muted); font-size:.68rem;
    font-weight:800; text-transform:uppercase; letter-spacing:.6px;
  }
  .sess-block{margin-top:12px}
  .sess-block + .sess-block{border-top:1px solid rgba(42,53,67,.55); padding-top:10px}

  /* Session progress */
  .sess-prog-head{display:flex; justify-content:space-between; align-items:baseline; gap:8px; font-size:.8rem; color:var(--muted); font-weight:700}
  .sess-prog-head b{color:var(--ink); font-weight:900}
  .sess-prog{
    height:8px; border-radius:999px; background:#101a24;
    border:1px solid rgba(42,53,67,.9); overflow:hidden; margin-top:6px;
  }
  .sess-prog > i{display:block; height:100%; border-radius:999px; background:linear-gradient(90deg,#22c55e,#4ade80); transition:width .25s ease}
  .sess-prog > i.done{background:linear-gradient(90deg,#ffd54a,#fff7a8); box-shadow:0 0 12px rgba(255,213,74,.5)}

  /* Per-muscle-group split */
  .split-row{display:grid; grid-template-columns:5.5rem 1fr auto; align-items:center; gap:8px; font-size:.82rem}
  .split-row + .split-row{margin-top:6px}
  .split-name{color:var(--ink); font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .split-track{height:8px; border-radius:999px; background:#101a24; border:1px solid rgba(42,53,67,.9); overflow:hidden}
  .split-track > i{display:block; height:100%; border-radius:999px}
  .split-val{color:var(--muted); font-weight:800; font-size:.76rem; white-space:nowrap; justify-self:end}

  /* PRs hit today */
  .pr-hits{display:flex; flex-direction:column; gap:6px}
  .pr-hit{
    display:flex; align-items:center; gap:8px; font-size:.84rem; font-weight:800;
    background:linear-gradient(90deg, rgba(58,42,0,.55), rgba(11,17,24,.5));
    border:1px solid rgba(255,213,74,.45); border-radius:10px; padding:7px 9px;
  }
  .pr-hit .pr-name{color:#ffd54a; flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .pr-hit .pr-val{color:var(--ink); white-space:nowrap}
  .pr-hit .pr-kind{color:var(--muted); font-size:.7rem; font-weight:800; text-transform:uppercase; letter-spacing:.4px; white-space:nowrap}
  .sess-empty{color:var(--muted); font-size:.82rem; font-weight:700}

  .totals{position:sticky; top:0; z-index:20; display:flex; gap:8px; flex-wrap:wrap; align-items:center;
    background:rgba(13,19,26,.9); backdrop-filter:saturate(1.1) blur(3px); border:1px solid var(--ring); border-radius:12px; padding:10px; font-size:.95rem}
  .totals.hidden{display:none}
  .chip{background:#0b1118; border:1px solid var(--ring); padding:.35rem .6rem; border-radius:999px; color:var(--muted)}
  .chip b{color:var(--ink)}
  .actions{display:flex; gap:10px; flex-wrap:wrap}
  .btn{all:unset; cursor:pointer; padding:.7rem 1rem; border-radius:12px; font-weight:700; background:linear-gradient(90deg,#4CAF50,#22c55e); color:#04130a; box-shadow:0 6px 20px rgba(34,197,94,.25)}
  .btn-ghost{all:unset; cursor:pointer; padding:.6rem .9rem; border:1px solid var(--ring); border-radius:10px; color:muted}
  .btn-danger{all:unset; cursor:pointer; padding:.45rem .6rem; border:1px solid #3a2227; border-radius:8px; color:#fecaca; background:#2a0f12}
  .btn-small{padding:.35rem .55rem; font-size:.85rem}
  .btn-today{all:unset; cursor:pointer; padding:.6rem .9rem; border:1px solid #d97706; border-radius:10px; color:#fbbf24; background:linear-gradient(90deg,#f59e0b,#d97706); font-weight:700}
  .btn-purple{all:unset; cursor:pointer; padding:.7rem 1rem; border-radius:12px; font-weight:700; background:linear-gradient(90deg,#8b5cf6,#a855f7); color:#f3e8ff; box-shadow:0 6px 20px rgba(168,85,247,.25)}

  .supergroup{background:#0b1118; border:1px solid var(--ring); border-radius:14px; padding:10px}
  .supergroup h2{margin:.2rem 0 .4rem; font-size:1rem; color:#c7d2fe}
  .supergroup.hidden{display:none}

  /* ===== Completed: collapsible body-part sections ===== */
  .cgroup{
    background:#0b1118; border:1px solid var(--ring);
    border-radius:14px; overflow:hidden; margin-top:8px;
  }
  .cgroup-head{
    display:flex; align-items:center; gap:10px;
    padding:12px 12px; cursor:pointer;
    background:linear-gradient(90deg,#111c27,#0b1118);
    border-bottom:1px solid var(--ring);
    -webkit-tap-highlight-color:transparent;
  }
  .cgroup.collapsed .cgroup-head{border-bottom-color:transparent}
  .cgroup-head:active{background:linear-gradient(90deg,#16232f,#0d141c)}
  .cgroup-chev{
    color:var(--muted); font-size:.75rem; flex:0 0 auto;
    transition:transform .18s ease; pointer-events:none;
  }
  .cgroup.collapsed .cgroup-chev{transform:rotate(-90deg)}
  .cgroup-name{font-weight:900; font-size:1.02rem; color:var(--ink); flex:1 1 auto; min-width:0; pointer-events:none}
  .cgroup-meta{color:var(--muted); font-size:.8rem; font-weight:800; white-space:nowrap; pointer-events:none}
  .cgroup-body{padding:6px 10px 10px}
  .cgroup.collapsed .cgroup-body{display:none}

  /* Per-exercise collapse inside a completed group */
  .ex-chev{color:var(--muted); font-size:.7rem; transition:transform .18s ease; flex:0 0 auto}
  .ex.ex-collapsed .ex-chev{transform:rotate(-90deg)}
  .ex.ex-collapsed .ex-body{display:none}


  .group{background:#0b1118; border:1px solid var(--ring); border-radius:14px; padding:10px; margin-top:10px; position:relative}
  .group h3{margin:.1rem 0 .4rem; font-size:1rem; color:var(--muted)}
  .group.hidden{display:none}

  .ex{border:1px dashed var(--ring); border-radius:12px; padding:10px; margin:8px 0; display:grid; gap:8px; background:#0e141b}
  .ex.finished{background:var(--finished-bg); border-color:var(--finished-ring)}
  .ex.copied{background:var(--copied-bg); border-color:var(--copied-ring)}

  .ex.drag-armed{outline:1px dashed #375a7f}
  .ex.dragging{opacity:.6; transform:scale(.995)}
  .ex.drop-over{outline:2px solid #2dd4bf}

  .ex-header{display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap}
  .ex-name{font-weight:700}
  .tag{font-size:.9rem; color:var(--muted)}
  .sets{display:grid; gap:6px}
  .ex-actions-bottom{display:flex; gap:8px; margin-top:4px; justify-content:space-between; align-items:center}

  .set-row{display:grid; grid-template-columns: auto auto auto 1fr auto; gap:8px; align-items:center}
  .weight-input-group{display:flex; align-items:center; gap:4px}
  .num-input{width:6ch; max-width:6ch; padding:.55rem .55rem; border:1px solid #15212c; border-radius:8px; background:#091017; color:var(--ink); font-variant-numeric:tabular-nums; min-height:44px}
  .num-input:focus{outline:2px solid #213240}
  .num-input.copied{background:var(--copied-bg); border-color:var(--copied-ring); color:var(--copied-text)}
  .lbs-label{font-size:.85rem; color:var(--muted); white-space:nowrap}
  .flags{display:flex; align-items:center; gap:12px; color:var(--muted); font-size:.9rem}


  .group-header{display:flex; align-items:center; justify-content:space-between; cursor:pointer; padding:4px 0; border-bottom:1px solid var(--ring); margin-bottom:8px;}
  .group-title{display:flex; align-items:center; gap:8px;}
  .collapse-icon{font-size:1.2rem; color:var(--muted); transition:transform 0.2s ease;}
  .group.collapsed .collapse-icon{transform:rotate(-90deg);}
  .group.collapsed .group-content{display:none;}
  .ex-header{cursor:pointer; position:relative;}

  .spacer{height:70px}

  .popup{position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:center; justify-content:center; padding:10px; z-index:100}
  .sheet{width:min(650px, 96%); max-height:85vh; overflow:auto; background:#0b1118; border:1px solid var(--ring); border-radius:14px; padding:12px}
  .x{all:unset; cursor:pointer; float:right; border:1px solid var(--ring); padding:.25rem .5rem; border-radius:8px; color:#9fb0c7}
  .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:8px}
  .opt{border:1px solid var(--ring); padding:10px; border-radius:10px; cursor:pointer; background:#0e151e; position:relative}
  .opt:hover{outline:1px solid #2b3a4a}
  .opt.used{background:var(--orange-bg); border-color:var(--orange); color:var(--orange)}
  .ex-popup-header{display:flex; align-items:center; gap:10px; margin:6px 0 10px}
  .back-btn{all:unset; cursor:pointer; border:1px solid var(--ring); padding:.25rem .5rem; border-radius:8px; color:#9fb0c7}
  .create-row{display:flex; gap:8px; align-items:center; margin-bottom:8px}
  .create-input{flex:1; padding:.6rem .7rem; border:1px solid var(--ring); border-radius:10px; background:#0a1118; color:#e8eef6}
  .create-btn{all:unset; cursor:pointer; padding:.6rem .9rem; border-radius:10px; font-weight:700; background:linear-gradient(90deg,#4CAF50,#22c55e); color:#04130a; border:1px solid #295c38}
  .calendar{display:grid; grid-template-columns:repeat(7,1fr); gap:4px}
  .cal-head{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin:4px 0; color:#9fb0c7; font-size:.85rem}
  .cal-cell{border:1px solid var(--ring); border-radius:8px; padding:8px; text-align:center; background:#0f141b}
  .cal-cell.workout{background:#0e1a12}
  .cal-nav{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:6px}
  .cal-nav button{all:unset; cursor:pointer; border:1px solid var(--ring); padding:.3rem .6rem; border-radius:8px}
  .workout-card{border:1px solid var(--ring); border-radius:10px; padding:12px; margin:8px 0; cursor:pointer; background:#0e151e; transition: all 0.2s ease;}
  .workout-card:hover{outline:1px solid #2b3a4a; background:#101722;}
  .workout-date{font-weight:700; color:var(--ink); margin-bottom:4px;}
  .workout-day{color:var(--muted); font-size:.9rem; margin-bottom:6px;}
  .workout-body-parts{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px;}
  .body-part-tag{background:#1a2332; color:var(--accent); padding:.2rem .5rem; border-radius:999px; font-size:.8rem; border:1px solid rgba(76,175,80,.3);}
  .workout-exercises{font-size:.85rem; color:var(--muted); margin-top:4px;}
  .workout-stats{display:flex; gap:12px; margin-top:6px; font-size:.8rem; color:var(--muted);}
  
  /* ===== Exercise history modal ===== */
  .hist-pr{
    display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;
    background:#0f141b; border:1px solid var(--ring); border-radius:12px; padding:10px;
  }
  .hist-pr .k{
    color:var(--muted); font-weight:800; text-transform:uppercase;
    letter-spacing:.5px; font-size:.68rem;
  }
  .hist-pr .v{color:#ffd54a; font-weight:900; font-size:1.05rem; text-shadow:0 0 12px rgba(255,213,74,.35)}
  .hist-pr .sep{color:#2a3949; font-weight:900}
  .hist-pr .note{color:var(--muted); font-weight:700; font-size:.82rem}

  .hist-session{border-top:1px solid rgba(42,53,67,.55); margin-top:12px; padding-top:10px}
  .hist-head{display:flex; align-items:baseline; gap:8px; margin-bottom:7px}
  .hist-date{font-weight:900; font-size:.92rem; color:#c7d2fe}
  .hist-meta{color:var(--muted); font-weight:700; font-size:.76rem}
  .hist-sets{display:grid; grid-template-columns:1fr; gap:5px}
  .hist-set{
    display:grid; grid-template-columns:3.1rem auto auto auto 1fr;
    align-items:center; gap:6px; padding:8px 9px; border-radius:10px;
    background:rgba(10,16,22,.55); border:1px solid rgba(42,53,67,.75); font-weight:900;
  }
  .hist-set .si-n{color:var(--muted); font-weight:800; font-size:.7rem; letter-spacing:.5px}
  .hist-set .si-unit, .hist-set .si-x{color:var(--muted); font-weight:800; font-size:.82rem}
  .hist-set .si-w, .hist-set .si-r{font-size:1.02rem}
  .hist-set.set-top{border-color:rgba(255,213,74,.5); background:linear-gradient(90deg, rgba(58,42,0,.5), rgba(10,16,22,.55))}
  .hist-set.set-top .si-n{color:#ffd54a}

  /* ===== Sets list (single column, in the order performed) ===== */
  .set-grid{display:grid; grid-template-columns:1fr; gap:6px; margin-top:10px}

  .set-item{
    display:grid;
    grid-template-columns:3.1rem auto auto auto auto 1fr;
    align-items:center;
    gap:6px;
    padding:9px 10px;
    border-radius:10px;
    background:rgba(10,16,22,.55);
    border:1px solid rgba(42,53,67,.75);
    font-weight:900;
    letter-spacing:.02em;
  }
  .set-item .si-unit, .set-item .si-x{color:var(--muted); font-weight:800; font-size:.85rem}
  .set-item .si-n{color:var(--muted); font-weight:800; font-size:.72rem; letter-spacing:.5px}
  .set-item .si-w, .set-item .si-r{font-size:1.05rem}
  .set-item .si-vol{color:var(--muted); font-weight:800; font-size:.76rem; justify-self:end; white-space:nowrap}
  .set-item.set-top{
    border-color:rgba(255,213,74,.55);
    background:linear-gradient(90deg, rgba(58,42,0,.55), rgba(10,16,22,.55));
  }
  .set-item.set-top .si-n{color:#ffd54a}
  .set-item.set-special{
    background:linear-gradient(180deg,#2a2100,#3a2a00);
    border-color:#fbbf24;
  }

  /* ===== Completed exercise: PR summary + trend sparkline ===== */
  .prsum{
    background:#0f141b; border:1px solid var(--ring);
    border-radius:12px; padding:10px; margin-top:8px;
  }
  .prsum-row{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; line-height:1.25}
  .prsum-row + .prsum-row{margin-top:6px}
  .prsum-row .k{
    color:var(--muted); font-weight:800; text-transform:uppercase;
    letter-spacing:.5px; font-size:.68rem; flex:0 0 auto; min-width:52px;
  }
  .prsum-row .v{color:var(--ink); font-weight:900; font-size:.98rem}
  .prsum-row .v.gold{color:#ffd54a; text-shadow:0 0 12px rgba(255,213,74,.4)}
  .prsum-row .sep{color:#2a3949; font-weight:900}
  .prsum-row .note{color:var(--muted); font-weight:700; font-size:.82rem}
  .prsum-row .note.gold{color:#ffd54a}
  .prsum-bar{
    height:6px; border-radius:999px; background:#101a24;
    border:1px solid rgba(42,53,67,.9); overflow:hidden; margin-top:8px;
  }
  .prsum-bar > i{display:block; height:100%; border-radius:999px; background:linear-gradient(90deg,#ff7a18,#ffc531)}
  .prsum-bar > i.gold{background:linear-gradient(90deg,#ffd54a,#fff7a8); box-shadow:0 0 12px rgba(255,213,74,.55)}

  .trend{margin-top:10px; border-top:1px solid rgba(42,53,67,.55); padding-top:8px}
  .trend-head{
    display:flex; justify-content:space-between; align-items:baseline; gap:8px;
    color:var(--muted); font-size:.68rem; font-weight:800;
    text-transform:uppercase; letter-spacing:.5px;
  }
  .trend-head b{color:var(--ink); font-size:.8rem}
  .trend-plot{position:relative; height:54px; margin-top:6px}
  .trend-lg .trend-plot{height:120px}
  .trend-plot svg{position:absolute; inset:0; width:100%; height:100%; display:block}
  .trend-area{fill:rgba(255,197,49,.13); stroke:none}
  .trend-line{fill:none; stroke:#ffc531; stroke-width:2; stroke-linejoin:round; stroke-linecap:round}
  .trend-dot{
    position:absolute; width:8px; height:8px; border-radius:50%;
    background:#ffc531; transform:translate(-50%,-50%);
    box-shadow:0 0 0 2px rgba(15,20,27,.9);
  }
  .trend-dot.sm{width:6px; height:6px; background:#e0a316}
  .trend-dot.gold{background:#fff7a8; box-shadow:0 0 0 2px rgba(15,20,27,.9), 0 0 12px rgba(255,213,74,.8)}
  .trend-foot{
    display:flex; justify-content:space-between; margin-top:4px;
    color:var(--muted); font-size:.68rem; font-weight:800;
  }


  .actions{display:flex; gap:10px; align-items:center; justify-content:flex-start; flex-wrap:wrap}
  .btn-workout-template{padding:.55rem .75rem; min-width:120px}
  .btn-stack{display:flex; flex-direction:column; line-height:1.05; text-align:center}
  .btn-stack .btn-sub{font-size:.8rem; opacity:.9; font-weight:900}

</style>
</head>
<body>
<header>
  <div class="bar">
    <button class="icon-btn" onclick="location.href='index.html'" aria-label="Home" title="Home">🏠</button>
    <span class="brand" title="Power Up!" aria-label="Power Up">⚡</span>
    <div class="date-nav">
      <button id="prevDay" aria-label="Previous day">←</button>
      <div class="date-str" id="dateStr">—</div>
      <button id="nextDay" aria-label="Next day">→</button>
    </div>
    <button class="icon-btn" id="openCalendar" aria-label="Calendar" title="Calendar">📅</button>
  </div>
  <div class="actions">

<script>
const exerciseOptions = {
  Chest: ['Bench Press','Incline Bench Press','Dumbbell Press','Dumbbell Flyes','Cable Fly','Chest Dips'],
  Back: ['Deadlift','Bent Over Row','Seated Cable Row','Lat Pulldown','One-arm DB Row','Chest-supported Row'],
  Biceps: ['Barbell Curl','DB Curl','Hammer Curl','Incline DB Curl','Cable Curl','Concentration Curl'],
  Triceps: ['Close-grip Bench','Skull Crushers','Cable Pushdown','Overhead Extension','Dips'],
  Shoulders: ['Overhead Press','Lateral Raise','Front Raise','Rear Delt Fly','Arnold Press','Upright Row','Shrug'],
  Legs: ['Back Squat','Front Squat','Leg Press','RDL','Lunge','Leg Extension','Ham Curl','Calf Raise'],
  Lats: ['Pull-up','Chin-up','Close Grip Pulldown','Pullover Machine'],
  Forearms: ['Dumbbell Wrist Curl'],
  Cardio: ['Running','Cycling','Rowing','Jump Rope','HIIT Circuit','Stair Climber']
};
const bodyParts = Object.keys(exerciseOptions);

const CUSTOM_KEY = 'powerUp:customExercises';
const getCustom = ()=> { try{ return JSON.parse(localStorage.getItem(CUSTOM_KEY)) || {}; }catch{ return {}; } };
const saveCustom = (obj)=> localStorage.setItem(CUSTOM_KEY, JSON.stringify(obj));

function addToCustomExercises(bodyPart, exerciseName) {
  const custom = getCustom();
  custom[bodyPart] = custom[bodyPart] || [];
  if (!custom[bodyPart].includes(exerciseName)) {
    custom[bodyPart].push(exerciseName);
    saveCustom(custom);
  }
  if (!exerciseOptions[bodyPart].includes(exerciseName)) {
    exerciseOptions[bodyPart].push(exerciseName);
  }
}

function getAllExercises(bp){
  const base = exerciseOptions[bp] || [];
  const extras = getCustom()[bp] || [];
  return [...new Set([...base, ...extras])];
}

const $ = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));
let current = new Date();
const keyFor = (d)=>`powerUp:${d.toISOString().slice(0,10)}`;

const esc = (s)=> String(s ?? '').replace(/[&<>"']/g, c => (
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
));

/* Collapse state for the Completed sections. Stored under its own key —
   never touches the `powerUp:YYYY-MM-DD` workout records. */
const UI_COLLAPSE_KEY = 'powerUp:uiCollapsed';
function getCollapseMap(){
  try{ return JSON.parse(localStorage.getItem(UI_COLLAPSE_KEY)) || {}; }catch{ return {}; }
}
function isCollapsed(id){ return !!getCollapseMap()[id]; }
function setCollapsedState(id, collapsed){ setCollapsedBulk([[id, collapsed]]); }

/* One write for many toggles — used by the expand/collapse-all buttons. */
function setCollapsedBulk(pairs){
  const m = getCollapseMap();
  pairs.forEach(([id, collapsed])=>{
    if(!id) return;
    if(collapsed) m[id] = 1; else delete m[id];
  });
  try{ localStorage.setItem(UI_COLLAPSE_KEY, JSON.stringify(m)); }catch{}
}

function blankDay(date){ return { date: date.toISOString().slice(0,10), exercises:[] }; }
function loadDay(date){ const raw = localStorage.getItem(keyFor(date)); return raw ? JSON.parse(raw) : blankDay(date); }
function saveDay(day){
  localStorage.setItem(`powerUp:${day.date}`, JSON.stringify(day));
  historyScanCache.clear();   // stored history changed — drop memoised scans
}

/* Memoises full-localStorage history scans. Rendering re-runs on every
   keystroke, so without this each one re-parses every stored workout. */
const historyScanCache = new Map();

/* FIX #3: Get exercise history function */
function getPreviousExerciseData(exerciseName, bodyPart) {
  for (let i = 1; i <= 90; i++) {
    const checkDate = new Date(current);
    checkDate.setDate(checkDate.getDate() - i);
    const rawData = localStorage.getItem(`powerUp:${checkDate.toISOString().slice(0,10)}`);
    if (rawData) {
      try {
        const day = JSON.parse(rawData);
        const previousEx = day.exercises?.find(ex => ex.name === exerciseName && ex.bodyPart === bodyPart);
        if (previousEx) return previousEx.sets;
      } catch {}
    }
  }
  return null;
}

function getPreviousWorkouts(limit=5){
  const workouts=[]; const today=new Date(); const cur=current.toISOString().slice(0,10);
  for(let i=1;i<=90 && workouts.length<limit;i++){
    const d=new Date(today); d.setDate(d.getDate()-i);
    const iso=d.toISOString().slice(0,10); if(iso===cur) continue;
    const raw=localStorage.getItem(`powerUp:${iso}`); if(!raw) continue;
    try{
      const day=JSON.parse(raw);
      if(day.exercises?.length){
        const stats=totalsFiltered(day);
        const bps=[...new Set(day.exercises.map(ex=>ex.bodyPart))];
        workouts.push({date:d, day, bodyParts:bps, stats});
      }
    }catch{}
  }
  return workouts;
}
function duplicateWorkout(sourceDay){
  const currentDay = loadDay(current);
  sourceDay.exercises.forEach(src=>{
    const existing=currentDay.exercises.find(e=>e.name===src.name && e.bodyPart===src.bodyPart);
    if(existing){
      const need = src.sets.length-existing.sets.length;
      for(let i=0;i<need;i++){
        const s=src.sets[existing.sets.length+i];
        existing.sets.push({weight:s.weight||'', reps:s.reps||'', superset:s.superset||false, done:false, copied:true});
      }
    }else{
      currentDay.exercises.push({
        id: uid(),
        bodyPart: src.bodyPart,
        name: src.name,
        finished: false,
        completed: false,
        copied: true,
        sets: src.sets.map(s=>({weight:s.weight||'', reps:s.reps||'', superset:s.superset||false, done:false, copied:true}))
      });
    }
  });
  saveDay(currentDay); render(); closePopup('#workoutPopup');
}

function exStats(ex){
  const vol = ex.sets.reduce((s,a)=> s + (Number(a.weight)||0)*(Number(a.reps)||0), 0);
  const reps = ex.sets.reduce((s,a)=> s + (Number(a.reps)||0), 0);
  const avg = reps ? vol / reps : 0;
  return { vol, reps, avg };
}

/* =========================
   Condensed Performance Summary (mobile-first)
   - Replaces per-set comparison rows with exercise-level aggregates
   ========================= */

function mdFromISO(iso){
  if(!iso) return '—';
  const d = new Date(String(iso).slice(0,10) + 'T00:00:00');
  return `${d.getMonth()+1}/${d.getDate()}`;
}

const sameExName = (a,b)=> String(a||'').toLowerCase().trim() === String(b||'').toLowerCase().trim();

/* Every logged session of one exercise, oldest → newest.
   `excludeISO` lets callers ask "what was my best BEFORE today?". Read-only. */
function scanExerciseSessions(exName, bodyPart, excludeISO){
  const cacheKey = `${String(exName||'').toLowerCase().trim()}|${bodyPart||''}|${excludeISO||''}`;
  if(historyScanCache.has(cacheKey)) return historyScanCache.get(cacheKey);

  const out = [];
  for(let i=0; i<localStorage.length; i++){
    const k = localStorage.key(i);
    if(!/^powerUp:\d{4}-\d{2}-\d{2}$/.test(k)) continue;
    const iso = k.slice('powerUp:'.length);
    if(excludeISO && iso === excludeISO) continue;

    try{
      const day = JSON.parse(localStorage.getItem(k));
      const ex = (day?.exercises || []).find(e =>
        sameExName(e.name, exName) && String(e.bodyPart||'') === String(bodyPart||'')
      );
      if(!ex) continue;
      out.push({ date: day?.date || iso, sets: ex.sets || [] });
    }catch{}
  }
  out.sort((a,b)=> a.date < b.date ? -1 : (a.date > b.date ? 1 : 0));
  historyScanCache.set(cacheKey, out);
  return out;
}

/* Heaviest set + biggest-volume session for an exercise across the given sessions. */
function bestsFromSessions(sessions){
  let topSet = { weight:0, reps:0, date:null };
  let bestVol = { vol:0, date:null };

  sessions.forEach(s=>{
    let vol = 0;
    (s.sets||[]).forEach(st=>{
      const w = Number(st.weight)||0, r = Number(st.reps)||0;
      vol += w * r;
      if(w > topSet.weight || (w === topSet.weight && r > topSet.reps)){
        topSet = { weight:w, reps:r, date:s.date };
      }
    });
    if(vol > bestVol.vol) bestVol = { vol, date:s.date };
  });

  return { topSet, bestVol, sessions: sessions.length };
}

/* Bests recorded on every day EXCEPT `excludeISO` — i.e. the mark to beat. */
function priorBests(exName, bodyPart, excludeISO){
  return bestsFromSessions(scanExerciseSessions(exName, bodyPart, excludeISO));
}

/* Heaviest set logged today for one exercise (ties broken by reps). */
function topSetOf(ex){
  let best = { weight:0, reps:0 };
  (ex.sets||[]).forEach(s=>{
    const w = Number(s.weight)||0, r = Number(s.reps)||0;
    if(w > best.weight || (w === best.weight && r > best.reps)) best = { weight:w, reps:r };
  });
  return best;
}

/* What kind of personal record (if any) this exercise set today. */
function prStatus(ex, iso){
  const top = topSetOf(ex);
  const { vol } = exStats(ex);
  const prior = priorBests(ex.name, ex.bodyPart, iso);

  const firstEver = prior.sessions === 0;
  const weightPR  = !firstEver && top.weight > 0 && top.weight > prior.topSet.weight;
  const repPR     = !firstEver && top.weight > 0 &&
                    top.weight === prior.topSet.weight && top.reps > prior.topSet.reps;
  const volumePR  = !firstEver && vol > 0 && vol > prior.bestVol.vol;

  return { top, vol, prior, firstEver, weightPR, repPR, volumePR,
           any: weightPR || repPR || volumePR };
}

/* Sparkline: <=n most recent sessions as {date, weight, vol}, oldest → newest. */
function trendPoints(exName, bodyPart, n = 8){
  return scanExerciseSessions(exName, bodyPart, null)
    .map(s=>{
      const weights = (s.sets||[]).map(x=>Number(x.weight)||0).filter(w=>w>0);
      return {
        date: s.date,
        weight: weights.length ? Math.max(...weights) : 0,
        vol: (s.sets||[]).reduce((a,x)=> a + (Number(x.weight)||0)*(Number(x.reps)||0), 0)
      };
    })
    .filter(p=> p.weight > 0)
    .slice(-n);
}


/* Mini line chart of top weight per session. Responsive: the SVG stretches
   (preserveAspectRatio=none) with a non-scaling stroke, and the end dot is an
   HTML element positioned in percentages so it stays circular. */
function renderTrendSparkline(points, opts = {}){
  const wrap = document.createElement('div');
  wrap.className = 'trend' + (opts.large ? ' trend-lg' : '');

  if(points.length < 2){
    wrap.innerHTML = `<div class="trend-head"><span>Trend</span><b>First session</b></div>`;
    return wrap;
  }

  const vals = points.map(p=>p.weight);
  const vMin = Math.min(...vals), vMax = Math.max(...vals);
  const span = (vMax - vMin) || 1;
  const flat = vMax === vMin;

  const X = i => (i / (points.length - 1)) * 100;
  const Y = v => flat ? 15 : 26 - ((v - vMin) / span) * 22;

  const coords = points.map((p,i)=> [X(i), Y(p.weight)]);
  const line = coords.map(([x,y],i)=> `${i ? 'L' : 'M'}${x.toFixed(2)} ${y.toFixed(2)}`).join(' ');
  const area = `${line} L100 30 L0 30 Z`;

  // one dot per session, so you can see how many sessions the line covers
  const dots = coords.map(([x,y],i)=>{
    const isLast = i === coords.length - 1;
    const cls = isLast
      ? (points[i].weight >= vMax ? 'trend-dot gold' : 'trend-dot')
      : 'trend-dot sm';
    return `<span class="${cls}" title="${mdFromISO(points[i].date)} · ${points[i].weight} lb"
      style="left:${x.toFixed(2)}%; top:${((y/30)*100).toFixed(2)}%"></span>`;
  }).join('');

  wrap.innerHTML = `
    <div class="trend-head">
      <span>Top weight · last ${points.length} sessions</span>
      <b>${vMin === vMax ? `${vMax} lb` : `${vMin}–${vMax} lb`}</b>
    </div>
    <div class="trend-plot">
      <svg viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true">
        <path class="trend-area" d="${area}"/>
        <path class="trend-line" d="${line}" vector-effect="non-scaling-stroke"/>
      </svg>
      ${dots}
    </div>
    <div class="trend-foot">
      <span>${mdFromISO(points[0].date)}</span>
      <span>${mdFromISO(points[points.length-1].date)}</span>
    </div>
  `;
  return wrap;
}

/* History modal: the PR to beat, the weight trend, and every set of the recent
   sessions — the numbers you need to pick today's opening weight. */
function openExerciseHistory(ex){
  const sessions = scanExerciseSessions(ex.name, ex.bodyPart, null)
    .map(s=>({ date: s.date, sets: (s.sets||[]).filter(x=> (Number(x.weight)||0) > 0 || (Number(x.reps)||0) > 0) }))
    .filter(s=> s.sets.length);

  if(!sessions.length){
    alert('No previous workout data found for this exercise');
    return;
  }

  $('#historyTitle').textContent = `${ex.name} — History`;
  const body = $('#historyBody');
  body.innerHTML = '';

  // heaviest set ever logged for this exercise
  const { topSet } = bestsFromSessions(sessions);
  const pr = document.createElement('div');
  pr.className = 'hist-pr';
  pr.innerHTML = `
    <span class="k">PR</span>
    <span class="v">${topSet.weight} lb × ${topSet.reps}</span>
    <span class="sep">·</span>
    <span class="note">${mdFromISO(topSet.date)}</span>
    <span class="sep">·</span>
    <span class="note">${sessions.length} session${sessions.length===1?'':'s'}</span>
  `;
  body.appendChild(pr);

  body.appendChild(renderTrendSparkline(trendPoints(ex.name, ex.bodyPart, 10), { large:true }));

  // recent sessions, newest first, with every set spelled out
  sessions.slice(-8).reverse().forEach(s=>{
    // index, not value — otherwise two identical top sets both get marked
    let topIdx = -1, best = {w:0, r:0};
    s.sets.forEach((x,i)=>{
      const w = Number(x.weight)||0, r = Number(x.reps)||0;
      if(w > best.w || (w === best.w && r > best.r)){ best = {w, r}; topIdx = i; }
    });

    const block = document.createElement('div');
    block.className = 'hist-session';
    block.innerHTML = `
      <div class="hist-head">
        <span class="hist-date">${mdFromISO(s.date)}</span>
        <span class="hist-meta">${s.sets.length} set${s.sets.length===1?'':'s'}</span>
      </div>
      <div class="hist-sets">
        ${s.sets.map((st,i)=>{
          const isTop = best.w > 0 && i === topIdx;
          return `<div class="hist-set${isTop ? ' set-top' : ''}">
            <span class="si-n">SET ${i+1}</span>
            <span class="si-w">${esc(st.weight ?? '—')}</span><span class="si-unit">lb</span>
            <span class="si-x">×</span><span class="si-r">${esc(st.reps ?? '—')}</span>
          </div>`;
        }).join('')}
      </div>
    `;
    body.appendChild(block);
  });

  openPopup('#historyPopup');
}

function renderExerciseComparisonSummary(ex){
  const iso = current.toISOString().slice(0,10);
  const st = prStatus(ex, iso);
  const { top, vol, prior, firstEver, weightPR, repPR, volumePR } = st;

  const bestVol = prior.bestVol.vol;
  const pctRaw  = bestVol > 0 ? Math.round((vol / bestVol) * 100) : (vol > 0 ? 100 : 0);
  const pct     = Math.max(0, Math.min(100, pctRaw));

  const topSetTxt = top.weight ? `${top.weight} lb × ${top.reps}` : '—';

  const prLine = firstEver
    ? `<span class="note">First time logging this exercise</span>`
    : `<span class="v">${prior.topSet.weight} lb × ${prior.topSet.reps}</span>
       <span class="sep">·</span>
       <span class="note">${mdFromISO(prior.topSet.date)}</span>`;

  const volNote = firstEver
    ? `<span class="note">no previous session to compare</span>`
    : volumePR
      ? `<span class="note gold">best ever — beat ${Math.round(bestVol).toLocaleString()} lb</span>`
      : `<span class="note">${pctRaw}% of best (${Math.round(bestVol).toLocaleString()} lb)</span>`;

  let badge = '';
  if(weightPR)      badge = `<span class="note gold">🏆 new weight PR</span>`;
  else if(repPR)    badge = `<span class="note gold">🏆 new rep PR at ${top.weight} lb</span>`;
  else if(firstEver)badge = `<span class="note">baseline</span>`;

  const wrap = document.createElement('div');
  wrap.className = 'prsum';
  wrap.innerHTML = `
    <div class="prsum-row">
      <span class="k">Top set</span>
      <span class="v${(weightPR||repPR) ? ' gold' : ''}">${topSetTxt}</span>
      ${badge}
    </div>
    <div class="prsum-row">
      <span class="k">PR</span>
      ${prLine}
    </div>
    <div class="prsum-row">
      <span class="k">Volume</span>
      <span class="v${volumePR ? ' gold' : ''}">${Math.round(vol).toLocaleString()} lb</span>
      ${volNote}
    </div>
    <div class="prsum-bar"><i class="${volumePR ? 'gold' : ''}" style="width:${volumePR ? 100 : pct}%"></i></div>
  `;

  wrap.appendChild(renderTrendSparkline(trendPoints(ex.name, ex.bodyPart, 8)));
  return wrap;
}
function countedSets(ex){ return ex.finished ? ex.sets : ex.sets.filter(s=> !!s.done); }
function totalsFiltered(day){
  let sets=0, vol=0, exCount=day.exercises.length;
  day.exercises.forEach(ex=>{
    const cs = countedSets(ex);
    sets += cs.length;
    vol  += cs.reduce((s,a)=> s + (Number(a.weight)||0)*(Number(a.reps)||0), 0);
  });
  return {sets, vol, exCount};
}
function areAllSetsDone(day){
  const all = day.exercises.flatMap(ex=> ex.sets);
  return all.length>0 && all.every(s=> !!s.done);
}

const POWER_LEVELS = [
  {th:0,    color:'#1e3a8a'},
  {th:1000, color:'#0ea5e9'},
  {th:2000, color:'#22c55e'},
  {th:3500, color:'#eab308'},
  {th:5000, color:'#f59e0b'},
  {th:6500, color:'#ef4444'},
  {th:8000, color:'#f5d142'}
];
let lastLevelIdx = -1;
const levelFor = (vol)=> POWER_LEVELS.reduce((idx,lv,i)=> vol>=lv.th?i:idx,0);
function applyPowerTheme(vol){
  const card = document.getElementById('powerCard');
  const idx = levelFor(vol);
  const col = POWER_LEVELS[idx].color;
  card.style.setProperty('--power-glow', col);
  const left = POWER_LEVELS[Math.max(0, idx-1)].color;
  const right = POWER_LEVELS[Math.min(POWER_LEVELS.length-1, idx+1)].color;
  const grad = `linear-gradient(90deg, transparent 0%, ${left}22 10%, ${col}55 30%, #ffffff22 50%, ${right}55 70%, transparent 90%)`;
  card.style.setProperty('--power-grad', grad);
  if(idx !== lastLevelIdx){
    document.body.classList.remove('level-up'); void card.offsetWidth; document.body.classList.add('level-up');
    lastLevelIdx = idx; setTimeout(()=>document.body.classList.remove('level-up'), 700);
  }
}

/* Completed view: one collapsible section per body part, every exercise
   stacked inside it. Nothing is hidden behind a tab — scroll, don't select. */
function renderCompletedGroups(list){
  const container = document.getElementById('log-completed');
  const superNode = document.getElementById('sg-completed');

  const groups = list.reduce((m,o)=>((m[o.bodyPart]??=[]).push(o),m),{});
  const bps = Object.keys(groups).sort();

  superNode.classList.toggle('hidden', bps.length === 0);
  container.innerHTML = '';
  if(bps.length === 0) return;

  bps.forEach(bp=>{
    const exList  = groups[bp];
    const volume  = exList.reduce((s,ex)=> s + exStats(ex).vol, 0);
    const setCnt  = exList.reduce((s,ex)=> s + (ex.sets||[]).length, 0);
    const key     = 'bp:' + bp;

    const g = document.createElement('div');
    g.className = 'cgroup' + (isCollapsed(key) ? ' collapsed' : '');
    g.dataset.key = key;
    g.innerHTML = `
      <div class="cgroup-head" data-act="toggleCGroup">
        <span class="cgroup-chev">▼</span>
        <span class="cgroup-name">${esc(bp)}</span>
        <span class="cgroup-meta">${exList.length} ex · ${setCnt} sets · ${Math.round(volume).toLocaleString()} lb</span>
      </div>
      <div class="cgroup-body"></div>
    `;

    const body = g.querySelector('.cgroup-body');
    exList.forEach(ex=> body.appendChild(renderExercise(ex)));
    container.appendChild(g);
  });
}


function renderSuperGroup(containerSel, superSel, list){
  const container = $(containerSel);
  container.innerHTML = '';

  const groups = list.reduce((m,o)=>((m[o.bodyPart]??=[]).push(o),m),{});
  const bodyPartsSorted = Object.keys(groups).sort();

  bodyPartsSorted.forEach(bp=>{
    const exList = groups[bp];
    if(!exList.length) return;

    const g = document.createElement('div');
    g.className = 'group'; g.dataset.bodypart = bp;
    g.innerHTML = `
      <div class="group-header" data-act="toggleGroup">

const PART_COLORS = {
  Chest:'#f87171', Back:'#60a5fa', Biceps:'#a78bfa', Triceps:'#f472b6',
  Shoulders:'#fbbf24', Legs:'#34d399', Lats:'#22d3ee', Forearms:'#fb923c',
  Cardio:'#94a3b8'
};
const partColor = p => PART_COLORS[p] || '#64748b';

/* Most recent earlier day that trained at least one of today's body parts. */
function findLastSimilarWorkout(day, iso){
  const todayParts = new Set(day.exercises.map(e=>e.bodyPart).filter(Boolean));
  if(!todayParts.size) return null;

  let best = null;
  for(let i=0; i<localStorage.length; i++){
    const k = localStorage.key(i);
    if(!/^powerUp:\d{4}-\d{2}-\d{2}$/.test(k)) continue;
    const d = k.slice('powerUp:'.length);
    if(d >= iso) continue;
    if(best && d <= best.date) continue;

    try{
      const prev = JSON.parse(localStorage.getItem(k));
      const parts = (prev?.exercises||[]).map(e=>e.bodyPart).filter(Boolean);
      if(!parts.some(p=>todayParts.has(p))) continue;
      const vol = totalsFiltered(prev).vol;
      if(vol <= 0) continue;
      best = { date:d, vol };
    }catch{}
  }
  return best;
}

function renderPowerCard(day){
  const iso = current.toISOString().slice(0,10);
  const { vol } = totalsFiltered(day);

  $('#powerVal').textContent = Math.round(vol).toLocaleString() + ' lb';

  // --- Headline: today vs the last workout that hit the same muscles ---
  const similar = findLastSimilarWorkout(day, iso);
  const trendEl = $('#powerTrend');
  trendEl.classList.remove('up','down');
  if(similar && vol > 0){
    const delta = vol - similar.vol;
    const sign  = delta >= 0 ? '+' : '−';
    trendEl.textContent = `${sign}${Math.abs(Math.round(delta)).toLocaleString()} lb vs ${mdFromISO(similar.date)}`;
    trendEl.classList.add(delta >= 0 ? 'up' : 'down');
  }else{
    trendEl.textContent = vol > 0 ? 'no comparable session yet' : '—';
  }

  // --- Session progress ---
  let doneSets = 0, allSets = 0;
  day.exercises.forEach(ex=>{
    (ex.sets||[]).forEach(s=>{ allSets++; if(ex.finished || s.done) doneSets++; });
  });
  const pctDone = allSets ? Math.round((doneSets/allSets)*100) : 0;
  const complete = allSets > 0 && doneSets === allSets;
  $('#progText').textContent = allSets ? `${doneSets} of ${allSets} sets${complete ? ' ✓' : ''}` : 'nothing logged yet';
  const fill = $('#progFill');
  fill.style.width = pctDone + '%';
  fill.classList.toggle('done', complete);

  // --- Volume split by muscle group ---
  const byPart = {};
  day.exercises.forEach(ex=>{
    const v = countedSets(ex).reduce((s,a)=> s + (Number(a.weight)||0)*(Number(a.reps)||0), 0);
    if(v <= 0) return;
    const p = ex.bodyPart || 'Other';
    byPart[p] = (byPart[p] || 0) + v;
  });
  const parts = Object.entries(byPart).sort((a,b)=> b[1]-a[1]);
  const splitBlock = $('#splitBlock');
  const splitList  = $('#splitList');
  splitBlock.style.display = parts.length ? '' : 'none';
  if(parts.length){
    const maxV = parts[0][1];
    splitList.innerHTML = parts.map(([p,v])=>`
      <div class="split-row">
        <span class="split-name">${esc(p)}</span>
        <span class="split-track"><i style="width:${Math.round((v/maxV)*100)}%; background:${partColor(p)}"></i></span>
        <span class="split-val">${Math.round(v).toLocaleString()} lb · ${Math.round((v/vol)*100)}%</span>
      </div>
    `).join('');
  }

  // --- PRs set today (finished exercises only) ---
  const hits = [];
  day.exercises.filter(ex=>ex.finished).forEach(ex=>{
    const st = prStatus(ex, iso);
    if(st.weightPR)      hits.push({ name:ex.name, val:`${st.top.weight} lb × ${st.top.reps}`, kind:'weight' });
    else if(st.repPR)    hits.push({ name:ex.name, val:`${st.top.weight} lb × ${st.top.reps}`, kind:'reps' });
    else if(st.volumePR) hits.push({ name:ex.name, val:`${Math.round(st.vol).toLocaleString()} lb`, kind:'volume' });
  });
  const prBlock = $('#prBlock');
  prBlock.style.display = hits.length ? '' : 'none';
  if(hits.length){
    $('#prHits').innerHTML = hits.map(h=>`
      <div class="pr-hit">
        <span class="pr-name">${esc(h.name)}</span>
        <span class="pr-val">${esc(h.val)}</span>
        <span class="pr-kind">${h.kind} PR</span>
      </div>
    `).join('');
  }

  applyPowerTheme(vol);
}

function renderExercise(ex){
  const node = document.createElement('div');
  node.className = 'ex' + (ex.finished ? ' finished' : '') + (ex.copied ? ' copied' : '');
  node.dataset.id = ex.id;
  node.setAttribute('tabindex','0');

  const {vol, avg} = exStats(ex);
  const copiedText = ex.copied ? ' (copied)' : '';

  // ---------- Completed exercise ----------
  if(ex.finished){
    const exKey = `ex:${ex.bodyPart}:${ex.name}`;
    node.dataset.key = exKey;
    if(isCollapsed(exKey)) node.classList.add('ex-collapsed');

    node.innerHTML = `
      <div class="ex-header" data-act="toggleCExercise">
        <span class="ex-chev">▼</span>
        <div style="flex:1 1 auto; min-width:0">
          <div class="ex-name">${esc(ex.name)}${copiedText}</div>

        </div>

        <div class="sets"></div>

            <button class="btn-ghost btn-small" data-act="viewHistory">📊 History</button>
          </div>
        </div>
      </div>
    `;

    const setsWrap = node.querySelector('.sets');
    setsWrap.appendChild(renderExerciseComparisonSummary(ex));

    // Sets in a single column, in the order they were performed.
    const setGrid = document.createElement('div');
    setGrid.className = 'set-grid';
    setsWrap.appendChild(setGrid);

    const top = topSetOf(ex);
    const topIdx = (ex.sets||[]).findIndex(s=>
      (Number(s.weight)||0) === top.weight && (Number(s.reps)||0) === top.reps
    );
    (ex.sets||[]).forEach((s,i)=>
      setGrid.appendChild(renderSet(ex.id, s, i, true, top.weight > 0 && i === topIdx))
    );

    return node;
  }

  // ---------- In-progress exercise ----------
  node.innerHTML = `
    <div class="ex-header" data-act="toggleExercise">
      <div>
        <div class="ex-name">${ex.name}${copiedText}</div>
        <div class="tag">${ex.sets.length} set(s) • ${Math.round(vol).toLocaleString()} lb • avg ${Math.round(avg)} lb/rep</div>
      </div>
    </div>

    <div class="sets"></div>

    <div class="ex-actions-bottom">
      <div>
        <button class="btn-ghost btn-small" data-act="addSet">+ Set</button>

        <button class="btn" style="padding:.6rem 1.2rem; background:linear-gradient(90deg,#4CAF50,#22c55e); color:#04130a" data-act="markComplete">
          ${ex.completed ? 'Completed ✓' : 'Complete'}
        </button>

        <button class="btn-ghost btn-small" data-act="viewHistory">📊 History</button>
      </div>

      <div style="display:flex; gap:8px">
        <button class="btn-ghost btn-small" data-act="removeSet" ${ex.sets.length <= 1 ? 'style="display:none"' : ''}>− Set</button>
        <button class="btn-danger btn-small" data-act="removeExercise">Remove Exercise</button>
      </div>
    </div>
  `;

  const setsWrap = node.querySelector('.sets');
  ex.sets.forEach((s, i) => setsWrap.appendChild(renderSet(ex.id, s, i, false)));

  return node;
}

function renderSet(exId, s, idx, locked = false, isTop = false) {
  const row = document.createElement('div');
  row.className = 'set-row' + (locked ? ' locked' : '') + (s.restPause ? ' rest-pause' : ''); row.dataset.exId = exId; row.dataset.idx = idx;
  if (locked) {
    const special = !!(s.restPause || s.superset || s.special || s.extra);
    row.className = 'set-item' + (special ? ' set-special' : '') + (isTop ? ' set-top' : '');
    row.dataset.exId = exId; row.dataset.idx = idx;
    const wNum = Number(s.weight)||0, rNum = Number(s.reps)||0;
    const w = (s.weight ?? '—');
    const r = (s.reps ?? '—');
    row.innerHTML =
      `<span class="si-n">SET ${idx+1}</span>` +
      `<span class="si-w">${esc(w)}</span><span class="si-unit">lb</span>` +
      `<span class="si-x">×</span><span class="si-r">${esc(r)}</span>` +
      `<span class="si-vol">${(wNum && rNum) ? (wNum*rNum).toLocaleString()+' lb' : ''}</span>`;
    return row;
  } else {
    const copiedClass = s.copied ? ' copied' : '';
    row.innerHTML = `
      <div class="weight-input-group">
        <input class="num-input${copiedClass}" inputmode="decimal" pattern="[0-9.]*" placeholder="Wt" value="${s.weight ?? ''}" data-field="weight"/>
        <span class="lbs-label">lbs</span>
      </div>
      <input class="num-input${copiedClass}" inputmode="numeric" pattern="[0-9]*" placeholder="Reps" value="${s.reps ?? ''}" data-field="reps"/>
      <div></div>
      <div class="flags">
        <label><input type="checkbox" ${s.superset?'checked':''} data-field="superset"/> Rest Pause</label>
        <label><input type="checkbox" ${s.done?'checked':''} data-field="done"/> Done</label>
      </div>
      <div class="tools"></div>
    `;
  }
  return row;
}

document.addEventListener('click', (e)=>{
  // closest() so clicks land even when they hit a child of the labelled element
  const host = e.target.closest('[data-act]'); if(!host) return;
  const act = host.dataset.act;

  if(act==='toggleGroup'){ const g=host.closest('.group'); if(g){ g.classList.toggle('collapsed'); } return; }
  if(act==='toggleExercise'){ const ex=host.closest('.ex'); if(ex){ ex.classList.toggle('collapsed'); } return; }

  // Completed view: remember which sections the user folded away
  if(act==='toggleCGroup'){
    const g = host.closest('.cgroup');
    if(g){ g.classList.toggle('collapsed'); setCollapsedState(g.dataset.key, g.classList.contains('collapsed')); }
    return;
  }
  if(act==='toggleCExercise'){
    const ex = host.closest('.ex');
    if(ex){ ex.classList.toggle('ex-collapsed'); setCollapsedState(ex.dataset.key, ex.classList.contains('ex-collapsed')); }
    return;
  }

  // Expand/collapse every section at once.
  // Completed "Collapse all" folds the exercise cards but leaves the body-part
  // sections open — that's the compact one-screen view worth screenshotting.
  if(act==='expandAll' || act==='collapseAll'){
    const collapse = (act === 'collapseAll');

    if(host.dataset.scope === 'completed'){
      const writes = [];
      document.querySelectorAll('#log-completed .cgroup').forEach(g=>{
        g.classList.remove('collapsed');
        writes.push([g.dataset.key, false]);
      });
      document.querySelectorAll('#log-completed .ex').forEach(ex=>{
        ex.classList.toggle('ex-collapsed', collapse);
        writes.push([ex.dataset.key, collapse]);
      });
      setCollapsedBulk(writes);
    }else{
      document.querySelectorAll('#log-inprogress .group')
        .forEach(g=> g.classList.toggle('collapsed', collapse));
    }
    return;
  }

  const day = parentDay();

  if(act==='addSet'){
    const exId = host.closest('.ex').dataset.id;
    const ex = day.exercises.find(x=>x.id===exId);
    const last = ex.sets.at(-1) || {};
    ex.sets.push({weight:last.weight??'', reps:last.reps??'', superset:last.superset??false, done:false, copied:(last.weight||last.reps)?true:false});
    saveDay(day); render(); return;
  }
  if(act==='removeSet'){
    const exId = e.target.closest('.ex').dataset.id;
    const ex = day.exercises.find(x=>x.id===exId);
    if(ex.sets.length>1){ ex.sets.pop(); saveDay(day); render(); }
    return;
  }
  if(act==='removeExercise'){
    if(!confirm('Remove this entire exercise?')) return;
    const exId = e.target.closest('.ex').dataset.id;
    const idx = day.exercises.findIndex(x=>x.id===exId);
    if(idx>=0){ day.exercises.splice(idx,1); saveDay(day); render(); }
    return;
  }

  // FIX #2: Single "Complete" button handles everything
  if(act==='markComplete'){
    const exId = e.target.closest('.ex').dataset.id;
    const ex = day.exercises.find(x=>x.id===exId);
    ex.completed = !ex.completed;
    if(ex.completed){
      ex.finished = true;
      ex.sets.forEach(s=>{ s.done=true; s.copied=false; });
      ex.copied=false;
    }
    saveDay(day); render(); return;
  }

  if(act==='viewHistory'){
    const exId = host.closest('.ex').dataset.id;
    const ex = day.exercises.find(x=>x.id===exId);
    openExerciseHistory(ex);
    return;
  }
});

    exNode.draggable = false;
    let pressTimer = null;
    const arm = ()=>{ exNode.classList.add('drag-armed'); exNode.draggable = true; };
    const disarm = ()=>{ exNode.classList.remove('drag-armed'); if(!exNode.classList.contains('dragging')) exNode.draggable=false; };

    const onPressStart = (evt)=>{
      const t = evt.target;
      if(t.closest('input') || t.closest('button')) return;
      pressTimer = setTimeout(arm, 300);
    };
    const onPressEnd = ()=>{ clearTimeout(pressTimer); setTimeout(disarm, 400); };

    exNode.addEventListener('mousedown', onPressStart);
    exNode.addEventListener('touchstart', onPressStart, {passive:true});
    ['mouseup','mouseleave','touchend','touchcancel'].forEach(ev=> exNode.addEventListener(ev, onPressEnd));

    exNode.addEventListener('dragstart', (e)=>{ exNode.classList.add('dragging'); e.dataTransfer.setData('text/plain', exNode.dataset.id); e.dataTransfer.effectAllowed='move'; });
    exNode.addEventListener('dragend', ()=>{ exNode.classList.remove('dragging'); exNode.draggable=false; exNode.classList.remove('drag-armed'); $$('.ex.drop-over').forEach(n=>n.classList.remove('drop-over')); });
  });

  document.body.addEventListener('dragover', (e)=>{
    const targetEx = e.target.closest('.ex');
    if(targetEx){ e.preventDefault(); targetEx.classList.add('drop-over'); }
  });
  document.body.addEventListener('dragleave', (e)=>{
    const targetEx = e.target.closest('.ex');
    if(targetEx){ targetEx.classList.remove('drop-over'); }
  });
  document.body.addEventListener('drop', (e)=>{
    const dest = e.target.closest('.ex');
    const destGroup = e.target.closest('.group');
    if(!dest || !destGroup) return;
    e.preventDefault();
    $$('.ex.drop-over').forEach(n=>n.classList.remove('drop-over'));

    const draggedId = e.dataTransfer.getData('text/plain');
    const destId = dest.dataset.id; if(!draggedId || draggedId===destId) return;

    const day = parentDay();
    const draggedIdx = day.exercises.findIndex(x=> x.id===draggedId);
    const destIdx = day.exercises.findIndex(x=> x.id===destId);
    if(draggedIdx<0 || destIdx<0) return;

    const destBP = destGroup.dataset.bodypart;
    day.exercises[draggedIdx].bodyPart = destBP;

    const destRect = dest.getBoundingClientRect();
    const before = (e.clientY < destRect.top + destRect.height/2);

    const item = day.exercises.splice(draggedIdx,1)[0];
    const newIndex = (draggedIdx < destIdx)
      ? (before ? destIdx-1 : destIdx)
      : (before ? destIdx : destIdx+1);

    day.exercises.splice(Math.max(0, Math.min(day.exercises.length, newIndex)), 0, item);
    saveDay(day); render();
  }, {capture:true});
}



$('#prevDay').addEventListener('click', ()=>{ current.setDate(current.getDate()-1); lastLevelIdx=-1; render(); });
$('#nextDay').addEventListener('click', ()=>{ current.setDate(current.getDate()+1); lastLevelIdx=-1; render(); });

$('#openCalendar').addEventListener('click', ()=>{ openPopup('#calPopup'); buildCalendar(current); });
$('#calPrev').addEventListener('click', ()=>{ shiftCalendar(-1); });
$('#calNext').addEventListener('click', ()=>{ shiftCalendar(1); });

function shiftCalendar(delta){ const d = new Date($('#calMonth').dataset.anchor); d.setMonth(d.getMonth()+delta); buildCalendar(d); }
function buildCalendar(anchorDate){
  const y = anchorDate.getFullYear(), m = anchorDate.getMonth();
  $('#calMonth').textContent = new Intl.DateTimeFormat(undefined,{month:'long',year:'numeric'}).format(anchorDate);
  $('#calMonth').dataset.anchor = new Date(y,m,1).toISOString();
  const grid = $('#calGrid'); grid.innerHTML='';
  const first = new Date(y,m,1).getDay();
  const last = new Date(y,m+1,0).getDate();
  for(let i=0;i<first;i++){ const c=document.createElement('div'); c.className='cal-cell'; c.style.visibility='hidden'; grid.appendChild(c); }
  for(let d=1; d<=last; d++){
    const c = document.createElement('div'); c.className='cal-cell'; c.textContent = d;
    const dateISO = new Date(y,m,d).toISOString().slice(0,10);
    if(localStorage.getItem(`powerUp:${dateISO}`)){
      const day = JSON.parse(localStorage.getItem(`powerUp:${dateISO}`));
      if(day.exercises?.length) c.classList.add('workout');
    }
    c.addEventListener('click', ()=>{ current = new Date(y,m,d); closePopup('#calPopup'); lastLevelIdx=-1; render(); });
    grid.appendChild(c);
  }
}

(function init(){
  const legacy = localStorage.getItem('powerUp');
  if(legacy){ try{ const data = JSON.parse(legacy); if(data?.date){ localStorage.setItem(`powerUp:${data.date}`, legacy); } }catch{} }
  
  const params = new URLSearchParams(window.location.search);
  const dateParam = params.get('date');
  
  if(dateParam) {
    current = new Date(dateParam + 'T12:00:00');
  } else {
    current = new Date();
  }
  
  render();
})();
</script>
