<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Power Up! — Today</title>
<link rel="stylesheet" href="sessionSummary.css" />
<link rel="stylesheet" href="muscleCalendar.css" />
<style>
  :root{
    --bg:#080c11; --panel:#0d131a; --ink:#e8eef6; --muted:#9fb0c7; --ring:#1c2a37;
    --accent:#4CAF50; --danger:#ef4444; --warn:#f59e0b;
    --finished-bg:#0e141b; --finished-ring:#1c2a37;
    --orange:#ff9500; --orange-bg:#2a1f0a;

    --power-glow:#1e3a8a;
    --power-grad: linear-gradient(90deg,#0b1118, #0b1118);
    
    --copied-bg:#1a1f2b; --copied-ring:#2a3447; --copied-text:#22c55e;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Arial;
    background:linear-gradient(180deg,#070b10 0%, #0a1016 100%); color:var(--ink);
    display:flex; flex-direction:column;
  }

  /* Header scrolls away with the page — it is not sticky. Only the compact
     totals strip stays pinned, so nothing can overlap the action buttons. */
  header{
    background: linear-gradient(180deg, rgba(11,15,20,.95), rgba(11,15,20,.75));
    border-bottom:1px solid var(--ring); color:var(--ink); padding:8px 10px;
  }
  .bar{display:flex; align-items:center; gap:7px}
  .icon-btn{
    all:unset; cursor:pointer; flex:0 0 auto;
    width:38px; height:38px; border:1px solid var(--ring); border-radius:10px;
    display:inline-flex; align-items:center; justify-content:center;
    font-size:1.05rem; line-height:1;
  }
  .icon-btn:active{background:#16202b}

  .date-nav{display:flex; align-items:center; gap:4px; flex:1 1 auto; min-width:0}
  .date-nav button{
    all:unset; cursor:pointer; flex:0 0 auto;
    width:32px; height:34px; border:1px solid var(--ring); border-radius:9px;
    display:inline-flex; align-items:center; justify-content:center;
  }
  .date-nav button:active{background:#16202b}
  .date-str{
    flex:1 1 auto; min-width:0; text-align:center; font-weight:900;
    font-size:.92rem; letter-spacing:.02em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  header .actions{margin-top:8px}

  .wrap{width:min(900px,100%); margin-inline:auto; padding:10px; display:flex; flex-direction:column; gap:10px; flex:1}

  .actions{display:flex; gap:10px; flex-wrap:wrap}
  .btn{all:unset; cursor:pointer; padding:.7rem 1rem; border-radius:12px; font-weight:700; background:linear-gradient(90deg,#4CAF50,#22c55e); color:#04130a; box-shadow:0 6px 20px rgba(34,197,94,.25)}
  .btn-ghost{all:unset; cursor:pointer; padding:.6rem .9rem; border:1px solid var(--ring); border-radius:10px; color:muted}
  .btn-danger{all:unset; cursor:pointer; padding:.45rem .6rem; border:1px solid #3a2227; border-radius:8px; color:#fecaca; background:#2a0f12}
  .btn-small{padding:.35rem .55rem; font-size:.85rem}
  .btn-today{all:unset; cursor:pointer; padding:.6rem .9rem; border:1px solid #d97706; border-radius:10px; color:#fbbf24; background:linear-gradient(90deg,#f59e0b,#d97706); font-weight:700}
  .btn-purple{all:unset; cursor:pointer; padding:.7rem 1rem; border-radius:12px; font-weight:700; background:linear-gradient(90deg,#8b5cf6,#a855f7); color:#f3e8ff; box-shadow:0 6px 20px rgba(168,85,247,.25)}



  .group{background:#0b1118; border:1px solid var(--ring); border-radius:14px; padding:10px; margin-top:10px; position:relative}
  .group h3{margin:.1rem 0 .4rem; font-size:1rem; color:var(--muted)}
  .group.hidden{display:none}


  .ex.drag-armed{outline:1px dashed #375a7f}
  .ex.dragging{opacity:.6; transform:scale(.995)}
  .ex.drop-over{outline:2px solid #2dd4bf}

  .ex-actions-bottom{display:flex; gap:8px; margin-top:4px; justify-content:space-between; align-items:center}

  /* Started but not finished - floated to the top of In Progress with a rail
     down the side so you can spot where you left off. */
  .ex.started{border-style:solid; border-color:#2b4a63; box-shadow:inset 3px 0 0 var(--accent)}

  /* transparent border/padding on every row so the PR state doesn't shift layout */
  .set-row{
    display:grid; grid-template-columns: auto auto auto 1fr auto; gap:8px; align-items:center;
    border:1px solid transparent; border-radius:10px; padding:4px 6px;
  }
  .set-row.set-pr{
    border-color:rgba(255,213,74,.55);
    background:linear-gradient(90deg, rgba(58,42,0,.6), rgba(10,16,22,.3));
    box-shadow:0 0 14px rgba(255,213,74,.16);
  }
  .pr-tag{
    display:inline-flex; align-items:center; gap:3px; white-space:nowrap;
    font-size:.64rem; font-weight:900; letter-spacing:.4px; color:#ffd54a;
    background:rgba(255,213,74,.14); border:1px solid rgba(255,213,74,.5);
    border-radius:999px; padding:.16rem .4rem;
    animation:prPop .32s ease-out;
  }
  @keyframes prPop{
    0%{transform:scale(.6); opacity:0}
    70%{transform:scale(1.12); opacity:1}
    100%{transform:scale(1); opacity:1}
  }
  .weight-input-group{display:flex; align-items:center; gap:4px}
  .num-input{width:6ch; max-width:6ch; padding:.55rem .55rem; border:1px solid #15212c; border-radius:8px; background:#091017; color:var(--ink); font-variant-numeric:tabular-nums; min-height:44px}
  .num-input:focus{outline:2px solid #213240}
  .num-input.copied{background:var(--copied-bg); border-color:var(--copied-ring); color:var(--copied-text)}
  .lbs-label{font-size:.85rem; color:var(--muted); white-space:nowrap}
  .flags{display:flex; align-items:center; gap:12px; color:var(--muted); font-size:.9rem}
  @media (max-width: 430px){
    .flags{gap:8px; font-size:.84rem}   /* claw back room for the PR tag */
    .set-row{gap:6px; padding:4px}
  }


  .group-header{display:flex; align-items:center; justify-content:space-between; cursor:pointer; padding:4px 0; border-bottom:1px solid var(--ring); margin-bottom:8px;}
  .group-title{display:flex; align-items:center; gap:8px;}
  .collapse-icon{font-size:1.2rem; color:var(--muted); transition:transform 0.2s ease;}
  .group.collapsed .collapse-icon{transform:rotate(-90deg);}
  .group.collapsed .group-content{display:none;}
  .ex-header{cursor:pointer; position:relative;}

  .spacer{height:70px}

  .popup{position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:center; justify-content:center; padding:10px; z-index:100}
  .sheet{width:min(650px, 96%); max-height:85vh; overflow:auto; background:#0b1118; border:1px solid var(--ring); border-radius:14px; padding:12px}
  .x{all:unset; cursor:pointer; float:right; border:1px solid var(--ring); padding:.25rem .5rem; border-radius:8px; color:#9fb0c7}
  .cal-host{clear:both; padding-top:8px}
  .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:8px}
  .opt{border:1px solid var(--ring); padding:10px; border-radius:10px; cursor:pointer; background:#0e151e; position:relative}
  .opt:hover{outline:1px solid #2b3a4a}
  .opt.used{background:var(--orange-bg); border-color:var(--orange); color:var(--orange)}
  .ex-popup-header{display:flex; align-items:center; gap:10px; margin:6px 0 10px}
  .back-btn{all:unset; cursor:pointer; border:1px solid var(--ring); padding:.25rem .5rem; border-radius:8px; color:#9fb0c7}
  .create-row{display:flex; gap:8px; align-items:center; margin-bottom:8px}
  .create-input{flex:1; padding:.6rem .7rem; border:1px solid var(--ring); border-radius:10px; background:#0a1118; color:#e8eef6}
  .create-btn{all:unset; cursor:pointer; padding:.6rem .9rem; border-radius:10px; font-weight:700; background:linear-gradient(90deg,#4CAF50,#22c55e); color:#04130a; border:1px solid #295c38}
  .workout-card{border:1px solid var(--ring); border-radius:10px; padding:12px; margin:8px 0; cursor:pointer; background:#0e151e; transition: all 0.2s ease;}
  .workout-card:hover{outline:1px solid #2b3a4a; background:#101722;}
  .workout-date{font-weight:700; color:var(--ink); margin-bottom:4px;}
  .workout-day{color:var(--muted); font-size:.9rem; margin-bottom:6px;}
  .workout-body-parts{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px;}
  .body-part-tag{background:#1a2332; color:var(--accent); padding:.2rem .5rem; border-radius:999px; font-size:.8rem; border:1px solid rgba(76,175,80,.3);}
  .workout-exercises{font-size:.85rem; color:var(--muted); margin-top:4px;}
  .workout-stats{display:flex; gap:12px; margin-top:6px; font-size:.8rem; color:var(--muted);}
  


  .actions{display:flex; gap:10px; align-items:center; justify-content:flex-start; flex-wrap:wrap}
  .btn-workout-template{padding:.55rem .75rem; min-width:120px}
  .btn-stack{display:flex; flex-direction:column; line-height:1.05; text-align:center}
  .btn-stack .btn-sub{font-size:.8rem; opacity:.9; font-weight:900}

</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="icon-btn" href="../main.html" aria-label="LevelUp home" title="LevelUp home">🏠</a>
    <a class="icon-btn" href="index.html" aria-label="Exercise home" title="Exercise home">💪</a>
    <div class="date-nav">
      <button id="prevDay" aria-label="Previous day">←</button>
      <div class="date-str" id="dateStr">—</div>
      <button id="nextDay" aria-label="Next day">→</button>
    </div>
    <button class="icon-btn" id="openCalendar" aria-label="Calendar" title="Calendar">📅</button>
  </div>
  <div class="actions">
    <button class="btn-purple btn-workout-template" id="addWorkout"><span class="btn-stack"><span>Workout</span><span class="btn-sub">Template</span></span></button>
    <button class="btn" id="addExercise">Add Exercise</button>
  </div>
</header>

<main class="wrap">
  <!-- Volume card, totals, In Progress / Completed: powerUp/sessionSummary.js -->
  <div id="summary"></div>

  <div class="spacer"></div>
</main>

<div class="popup" id="bpPopup">
  <div class="sheet">
    <button class="x" data-close="#bpPopup">✕</button>
    <h2 style="margin:6px 0 10px; font-size:1rem; color:#9fb0c7">Select Body Part</h2>
    <div class="grid" id="bpGrid"></div>
  </div>
</div>

<div class="popup" id="exPopup">
  <div class="sheet">
    <button class="x" data-close="#exPopup">✕</button>
    <div class="ex-popup-header">
      <button class="back-btn" id="backToBP">← Back</button>
      <h2 id="exTitle" style="margin:0; font-size:1rem; color:#9fb0c7; flex:1">Exercises</h2>
    </div>

    <div class="create-row">
      <input id="exCreateInput" class="create-input" placeholder="Create new exercise name…" />
      <button id="exCreateBtn" class="create-btn">Add</button>
    </div>

    <div class="grid" id="exGrid"></div>
  </div>
</div>

<div class="popup" id="calPopup">
  <div class="sheet">
    <button class="x" data-close="#calPopup">✕</button>
    <!-- same muscle-group calendar as the Exercise home: muscleCalendar.js -->
    <div class="cal-host" id="calHost"></div>
  </div>
</div>

<div class="popup" id="workoutPopup">
  <div class="sheet">
    <button class="x" data-close="#workoutPopup">✕</button>
    <h2 style="margin:6px 0 10px; font-size:1rem; color:#9fb0c7">Previous Workouts</h2>
    <div id="workoutHistory"></div>
  </div>
</div>


<script src="sessionSummary.js"></script>
<script src="muscleCalendar.js"></script>
<script>
const exerciseOptions = {
  Chest: ['Bench Press','Incline Bench Press','Dumbbell Press','Dumbbell Flyes','Cable Fly','Chest Dips'],
  Back: ['Deadlift','Bent Over Row','Seated Cable Row','Lat Pulldown','One-arm DB Row','Chest-supported Row'],
  Biceps: ['Barbell Curl','DB Curl','Hammer Curl','Incline DB Curl','Cable Curl','Concentration Curl'],
  Triceps: ['Close-grip Bench','Skull Crushers','Cable Pushdown','Overhead Extension','Dips'],
  Shoulders: ['Overhead Press','Lateral Raise','Front Raise','Rear Delt Fly','Arnold Press','Upright Row','Shrug'],
  Legs: ['Back Squat','Front Squat','Leg Press','RDL','Lunge','Leg Extension','Ham Curl','Calf Raise'],
  Lats: ['Pull-up','Chin-up','Close Grip Pulldown','Pullover Machine'],
  Forearms: ['Dumbbell Wrist Curl'],
  Cardio: ['Running','Cycling','Rowing','Jump Rope','HIIT Circuit','Stair Climber']
};
const bodyParts = Object.keys(exerciseOptions);

const CUSTOM_KEY = 'powerUp:customExercises';
const getCustom = ()=> { try{ return JSON.parse(localStorage.getItem(CUSTOM_KEY)) || {}; }catch{ return {}; } };
const saveCustom = (obj)=> localStorage.setItem(CUSTOM_KEY, JSON.stringify(obj));

function addToCustomExercises(bodyPart, exerciseName) {
  const custom = getCustom();
  custom[bodyPart] = custom[bodyPart] || [];
  if (!custom[bodyPart].includes(exerciseName)) {
    custom[bodyPart].push(exerciseName);
    saveCustom(custom);
  }
  if (!exerciseOptions[bodyPart].includes(exerciseName)) {
    exerciseOptions[bodyPart].push(exerciseName);
  }
}

function getAllExercises(bp){
  const base = exerciseOptions[bp] || [];
  const extras = getCustom()[bp] || [];
  return [...new Set([...base, ...extras])];
}

const $ = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));
let current = new Date();
const isoOf = (d)=> d.toISOString().slice(0,10);

/* Summary rendering, PR maths and history scans: powerUp/sessionSummary.js */
const SS = window.SessionSummary;
const { exStats, totalsFiltered, priorBests, beatsPriorPR } = SS;

const loadDay = (date)=> SS.loadDay(isoOf(date));
function saveDay(day){
  localStorage.setItem(`powerUp:${day.date}`, JSON.stringify(day));
  SS.clearCache();   // stored history changed — drop memoised scans
}

/* FIX #3: Get exercise history function */
function getPreviousExerciseData(exerciseName, bodyPart) {
  for (let i = 1; i <= 90; i++) {
    const checkDate = new Date(current);
    checkDate.setDate(checkDate.getDate() - i);
    const rawData = localStorage.getItem(`powerUp:${checkDate.toISOString().slice(0,10)}`);
    if (rawData) {
      try {
        const day = JSON.parse(rawData);
        const previousEx = day.exercises?.find(ex => ex.name === exerciseName && ex.bodyPart === bodyPart);
        if (previousEx) return previousEx.sets;
      } catch {}
    }
  }
  return null;
}

function getPreviousWorkouts(limit=5){
  const workouts=[]; const today=new Date(); const cur=current.toISOString().slice(0,10);
  for(let i=1;i<=90 && workouts.length<limit;i++){
    const d=new Date(today); d.setDate(d.getDate()-i);
    const iso=d.toISOString().slice(0,10); if(iso===cur) continue;
    const raw=localStorage.getItem(`powerUp:${iso}`); if(!raw) continue;
    try{
      const day=JSON.parse(raw);
      if(day.exercises?.length){
        const stats=totalsFiltered(day);
        const bps=[...new Set(day.exercises.map(ex=>ex.bodyPart))];
        workouts.push({date:d, day, bodyParts:bps, stats});
      }
    }catch{}
  }
  return workouts;
}
function duplicateWorkout(sourceDay){
  const currentDay = loadDay(current);
  sourceDay.exercises.forEach(src=>{
    const existing=currentDay.exercises.find(e=>e.name===src.name && e.bodyPart===src.bodyPart);
    if(existing){
      const need = src.sets.length-existing.sets.length;
      for(let i=0;i<need;i++){
        const s=src.sets[existing.sets.length+i];
        existing.sets.push({weight:s.weight||'', reps:s.reps||'', superset:s.superset||false, done:false, copied:true});
      }
    }else{
      currentDay.exercises.push({
        id: uid(),
        bodyPart: src.bodyPart,
        name: src.name,
        finished: false,
        completed: false,
        copied: true,
        sets: src.sets.map(s=>({weight:s.weight||'', reps:s.reps||'', superset:s.superset||false, done:false, copied:true}))
      });
    }
  });
  saveDay(currentDay); render(); closePopup('#workoutPopup');
}

const PR_TAG_HTML = '<span class="pr-tag">🏆 PR</span>';
function areAllSetsDone(day){
  const all = day.exercises.flatMap(ex=> ex.sets);
  return all.length>0 && all.every(s=> !!s.done);
}

let view = null;   // SessionSummary view over #summary, made in init()

function render(){
  $('#dateStr').textContent = SS.dateLabel(current);
  const day = loadDay(current);
  view.render(day, isoOf(current));

  if ($('#calPopup').style.display === 'flex') calendar.render();

  armDragAndDrop();
}

/* Any set ticked Done means this is the exercise being worked right now. */
function isStarted(ex){ return (ex.sets||[]).some(s=> !!s.done); }

/* The editable In Progress list — SessionSummary calls this into its own section. */
function renderInProgress(container, list){
  const groups = list.reduce((m,o)=>((m[o.bodyPart]??=[]).push(o),m),{});
  // Started work rises to the top: the body part you're mid-way through leads
  // the list, and inside it the started exercises come before the untouched
  // ones. Six exercises queued at the start of a session stay findable.
  const startRank = bp => groups[bp].some(isStarted) ? 0 : 1;
  const bodyPartsSorted = Object.keys(groups)
    .sort((a,b)=> startRank(a) - startRank(b) || a.localeCompare(b));

  bodyPartsSorted.forEach(bp=>{
    const exList = groups[bp].slice()
      .sort((a,b)=> (isStarted(a)?0:1) - (isStarted(b)?0:1));
    if(!exList.length) return;

    const g = document.createElement('div');
    g.className = 'group'; g.dataset.bodypart = bp;
    g.innerHTML = `
      <div class="group-header" data-act="toggleGroup">
        <div class="group-title">
          <span class="collapse-icon">▼</span>
          <h3 style="margin:0; font-size:1rem; color:var(--muted)">${bp}</h3>
        </div>
      </div>
      <div class="group-content"></div>
    `;
    const content = g.querySelector('.group-content');

    exList.forEach(ex=> content.appendChild(renderExercise(ex)));

    container.appendChild(g);
  });
}

function renderExercise(ex){
  const node = document.createElement('div');
  node.className = 'ex' + (ex.copied ? ' copied' : '') + (isStarted(ex) ? ' started' : '');
  node.dataset.id = ex.id;
  node.setAttribute('tabindex','0');

  const {vol, avg} = exStats(ex);
  const copiedText = ex.copied ? ' (copied)' : '';

  node.innerHTML = `
    <div class="ex-header" data-act="toggleExercise">
      <div class="ex-title">
        <div class="ex-name">${ex.name}${copiedText}</div>
        <div class="tag">${ex.sets.length} set${ex.sets.length===1?"":"s"} • ${Math.round(vol).toLocaleString()} lb • ${Math.round(avg)} lb/rep</div>
      </div>
      <div class="ex-head-actions">
        <button class="btn-complete" data-act="markComplete">Complete</button>
        <button class="btn-icon" data-act="viewHistory" title="History" aria-label="History">📊</button>
      </div>
    </div>

    <div class="sets"></div>

    <div class="ex-actions-bottom">
      <div>
        <button class="btn-ghost btn-small" data-act="addSet">+ Set</button>
      </div>

      <div style="display:flex; gap:8px">
        <button class="btn-ghost btn-small" data-act="removeSet" ${ex.sets.length <= 1 ? 'style="display:none"' : ''}>− Set</button>
        <button class="btn-danger btn-small" data-act="removeExercise">Remove Exercise</button>
      </div>
    </div>
  `;

  const setsWrap = node.querySelector('.sets');
  // one lookup per exercise, reused for every row
  const priorTop = priorBests(ex.name, ex.bodyPart, current.toISOString().slice(0,10)).topSet;
  ex.sets.forEach((s, i) => setsWrap.appendChild(renderSet(ex.id, s, i, priorTop)));

  return node;
}

function renderSet(exId, s, idx, priorTop = null) {
  const row = document.createElement('div');
  row.className = 'set-row' + (s.restPause ? ' rest-pause' : ''); row.dataset.exId = exId; row.dataset.idx = idx;
  const copiedClass = s.copied ? ' copied' : '';
  // the badge only appears once the set is ticked Done
  const isPR = !!s.done && beatsPriorPR(s, priorTop);
  if(isPR) row.classList.add('set-pr');

  row.innerHTML = `
    <div class="weight-input-group">
      <input class="num-input${copiedClass}" inputmode="decimal" pattern="[0-9.]*" placeholder="Wt" value="${s.weight ?? ''}" data-field="weight"/>
      <span class="lbs-label">lbs</span>
    </div>
    <input class="num-input${copiedClass}" inputmode="numeric" pattern="[0-9]*" placeholder="Reps" value="${s.reps ?? ''}" data-field="reps"/>
    <div class="pr-slot">${isPR ? PR_TAG_HTML : ''}</div>
    <div class="flags">
      <label><input type="checkbox" ${s.superset?'checked':''} data-field="superset"/> Rest Pause</label>
      <label><input type="checkbox" ${s.done?'checked':''} data-field="done"/> Done</label>
    </div>
    <div class="tools"></div>
  `;
  return row;
}

/* Refresh one row's PR state in place — used while typing, where a full
   re-render would steal focus from the input. */
function refreshRowPR(row, ex, s){
  const priorTop = priorBests(ex.name, ex.bodyPart, current.toISOString().slice(0,10)).topSet;
  const isPR = !!s.done && beatsPriorPR(s, priorTop);
  row.classList.toggle('set-pr', isPR);
  const slot = row.querySelector('.pr-slot');
  if(slot && (!!slot.firstChild) !== isPR) slot.innerHTML = isPR ? PR_TAG_HTML : '';
}

function uid(){ return Math.random().toString(36).slice(2,9); }
function openPopup(id){ $(id).style.display='flex'; if (id === '#bpPopup' || id === '#exPopup' || id === '#workoutPopup') document.body.classList.add('ss-popup-open'); }
function closePopup(id){ $(id).style.display='none'; document.body.classList.remove('ss-popup-open'); }
Array.from(document.querySelectorAll('.x')).forEach(btn=> btn.addEventListener('click', e=> closePopup(e.target.dataset.close)));

$('#addWorkout').addEventListener('click', ()=>{
  const workouts = getPreviousWorkouts();
  const container = $('#workoutHistory');
  container.innerHTML = workouts.length ? '' : '<p style="color:var(--muted); text-align:center; padding:20px;">No previous workouts found</p>';
  workouts.forEach(workout=>{
    const card=document.createElement('div'); card.className='workout-card';
    const dateStr = workout.date.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});
    const dayStr = workout.date.toLocaleDateString(undefined,{weekday:'long'});
    const names = workout.day.exercises.slice(0,3).map(ex=>ex.name);
    const preview = names.join(', ') + (workout.day.exercises.length>3?` +${workout.day.exercises.length-3} more`:'');

    card.innerHTML = `
      <div class="workout-date">${dateStr}</div>
      <div class="workout-day">${dayStr}</div>
      <div class="workout-body-parts">${workout.bodyParts.map(bp=>`<span class="body-part-tag">${bp}</span>`).join('')}</div>
      <div class="workout-exercises">${preview}</div>
      <div class="workout-stats"><span>${workout.stats.sets} sets</span><span>${Math.round(workout.stats.vol)} lb volume</span><span>${workout.stats.exCount} exercises</span></div>
    `;
    card.addEventListener('click', ()=> duplicateWorkout(workout.day));
    container.appendChild(card);
  });
  openPopup('#workoutPopup');
});

let currentBP = null;
$('#addExercise').addEventListener('click', ()=>{
  const day=loadDay(current);
  const used=[...new Set(day.exercises.map(ex=>ex.bodyPart))];
  const grid=$('#bpGrid'); grid.innerHTML='';
  bodyParts.forEach(bp=>{
    const div=document.createElement('div'); div.className='opt'; if(used.includes(bp)) div.classList.add('used');
    div.textContent=bp; div.dataset.bp=bp; grid.appendChild(div);
  });
  openPopup('#bpPopup');
});
$('#backToBP').addEventListener('click', ()=>{ closePopup('#exPopup'); openPopup('#bpPopup'); });
$('#bpGrid').addEventListener('click', (e)=>{
  const bp=e.target.closest('.opt')?.dataset.bp; if(!bp) return;
  currentBP = bp; closePopup('#bpPopup'); $('#exTitle').textContent = `Exercises — ${bp}`;
  populateExerciseGrid(bp); $('#exCreateInput').value=''; openPopup('#exPopup');
});
function populateExerciseGrid(bp){
  const day=loadDay(current);
  const used = day.exercises.filter(ex=>ex.bodyPart===bp).map(ex=>ex.name);
  const grid=$('#exGrid'); grid.innerHTML='';
  getAllExercises(bp).forEach(name=>{
    const div=document.createElement('div'); div.className='opt'; if(used.includes(name)) div.classList.add('used');
    div.textContent=name; div.dataset.name=name; div.dataset.bp=bp; grid.appendChild(div);
  });
}
$('#exCreateBtn').addEventListener('click', ()=>{
  const name=($('#exCreateInput').value||'').trim(); if(!name || !currentBP) return;
  addToCustomExercises(currentBP, name);
  createExerciseForDay(currentBP, name);
  closePopup('#exPopup');
});
$('#exGrid').addEventListener('click', (e)=>{
  const opt=e.target.closest('.opt'); if(!opt) return;
  const name=opt.dataset.name, bp=opt.dataset.bp;
  const day=loadDay(current);
  const existing = day.exercises.find(ex=>ex.name===name && ex.bodyPart===bp);
  if(existing){
    const last=existing.sets.at(-1)||{};
    existing.sets.push({weight:last.weight??'', reps:last.reps??'', superset:last.superset??false, done:false, copied:(last.weight||last.reps)?true:false});
    saveDay(day); render(); closePopup('#exPopup');
  }else{
    createExerciseForDay(bp, name); closePopup('#exPopup');
  }
});
function createExerciseForDay(bp, name){
  const day=loadDay(current);
  day.exercises.push({ id: uid(), bodyPart: bp, name, finished:false, completed:false, sets:[{weight:'', reps:'', superset:false, done:false}] });
  saveDay(day); render();
}

function parentDay(){ return loadDay(current); }

document.addEventListener('click', (e)=>{
  // closest() so clicks land even when they hit a child of the labelled element
  const host = e.target.closest('[data-act]'); if(!host) return;
  const act = host.dataset.act;

  if(act==='toggleGroup'){ const g=host.closest('.group'); if(g){ g.classList.toggle('collapsed'); } return; }
  if(act==='toggleExercise'){ const ex=host.closest('.ex'); if(ex){ ex.classList.toggle('collapsed'); } return; }

  const day = parentDay();

  if(act==='addSet'){
    const exId = host.closest('.ex').dataset.id;
    const ex = day.exercises.find(x=>x.id===exId);
    const last = ex.sets.at(-1) || {};
    ex.sets.push({weight:last.weight??'', reps:last.reps??'', superset:last.superset??false, done:false, copied:(last.weight||last.reps)?true:false});
    saveDay(day); render(); return;
  }
  if(act==='removeSet'){
    const exId = e.target.closest('.ex').dataset.id;
    const ex = day.exercises.find(x=>x.id===exId);
    if(ex.sets.length>1){ ex.sets.pop(); saveDay(day); render(); }
    return;
  }
  if(act==='removeExercise'){
    if(!confirm('Remove this entire exercise?')) return;
    const exId = e.target.closest('.ex').dataset.id;
    const idx = day.exercises.findIndex(x=>x.id===exId);
    if(idx>=0){ day.exercises.splice(idx,1); saveDay(day); render(); }
    return;
  }

  // FIX #2: Single "Complete" button handles everything
  if(act==='markComplete'){
    const exId = e.target.closest('.ex').dataset.id;
    const ex = day.exercises.find(x=>x.id===exId);
    ex.completed = !ex.completed;
    if(ex.completed){
      ex.finished = true;
      ex.sets.forEach(s=>{ s.done=true; s.copied=false; });
      ex.copied=false;
    }else{
      // Undo hands the card back editable - a mistyped weight is the whole
      // reason to reopen one. The sets stay ticked Done; they were performed.
      ex.finished = false;
    }
    saveDay(day); render(); return;
  }

});

document.addEventListener('input', (e)=>{
  const row = e.target.closest('.set-row'); if(!row) return;
  const field = e.target.dataset.field; if(!field) return;
  const day = parentDay();
  const ex = day.exercises.find(x=>x.id===row.dataset.exId);
  const idx = Number(row.dataset.idx);

  if(field==='weight' || field==='reps'){
    let clean = e.target.value.replace(/[^\d.]/g,'');
    if(clean.replace('.','').length > 4) clean = clean.slice(0,4);
    e.target.value = clean;
    ex.sets[idx][field] = clean;
    if(ex.sets[idx].copied){ ex.sets[idx].copied=false; e.target.classList.remove('copied'); }
    saveDay(day);

    const exNode = row.closest('.ex');
    const {vol:ev, avg} = exStats(ex);
    exNode.querySelector('.tag').textContent = `${ex.sets.length} set(s) • ${Math.round(ev).toLocaleString()} lb • avg ${Math.round(avg)} lb/rep`;

    view.renderTop(day);

    // editing an already-ticked set can make or break its PR
    if(ex.sets[idx].done) refreshRowPR(row, ex, ex.sets[idx]);
  }
});

document.addEventListener('change', (e)=>{
  const row = e.target.closest('.set-row'); if(!row) return;
  const field = e.target.dataset.field; if(!field) return;
  const day = parentDay();
  const ex = day.exercises.find(x=>x.id===row.dataset.exId);
  const idx = Number(row.dataset.idx);

  if(field==='done'){
    ex.sets[idx].done = e.target.checked; 
    if(e.target.checked){
      ex.sets[idx].copied=false;
      const w=row.querySelector('input[data-field="weight"]'); const r=row.querySelector('input[data-field="reps"]');
      if(w) w.classList.remove('copied'); if(r) r.classList.remove('copied');
      saveDay(day); render(); return;
    }
    // re-render on untick too, so a PR badge clears with its checkbox
    saveDay(day); render(); return;
  }
  if(field==='superset'){ ex.sets[idx].superset = e.target.checked; saveDay(day); }
});

function armDragAndDrop(){
  Array.from(document.querySelectorAll('.ex')).forEach(exNode=>{
    exNode.draggable = false;
    let pressTimer = null;
    const arm = ()=>{ exNode.classList.add('drag-armed'); exNode.draggable = true; };
    const disarm = ()=>{ exNode.classList.remove('drag-armed'); if(!exNode.classList.contains('dragging')) exNode.draggable=false; };

    const onPressStart = (evt)=>{
      const t = evt.target;
      if(t.closest('input') || t.closest('button')) return;
      pressTimer = setTimeout(arm, 300);
    };
    const onPressEnd = ()=>{ clearTimeout(pressTimer); setTimeout(disarm, 400); };

    exNode.addEventListener('mousedown', onPressStart);
    exNode.addEventListener('touchstart', onPressStart, {passive:true});
    ['mouseup','mouseleave','touchend','touchcancel'].forEach(ev=> exNode.addEventListener(ev, onPressEnd));

    exNode.addEventListener('dragstart', (e)=>{ exNode.classList.add('dragging'); e.dataTransfer.setData('text/plain', exNode.dataset.id); e.dataTransfer.effectAllowed='move'; });
    exNode.addEventListener('dragend', ()=>{ exNode.classList.remove('dragging'); exNode.draggable=false; exNode.classList.remove('drag-armed'); $$('.ex.drop-over').forEach(n=>n.classList.remove('drop-over')); });
  });

  document.body.addEventListener('dragover', (e)=>{
    const targetEx = e.target.closest('.ex');
    if(targetEx){ e.preventDefault(); targetEx.classList.add('drop-over'); }
  });
  document.body.addEventListener('dragleave', (e)=>{
    const targetEx = e.target.closest('.ex');
    if(targetEx){ targetEx.classList.remove('drop-over'); }
  });
  document.body.addEventListener('drop', (e)=>{
    const dest = e.target.closest('.ex');
    const destGroup = e.target.closest('.group');
    if(!dest || !destGroup) return;
    e.preventDefault();
    $$('.ex.drop-over').forEach(n=>n.classList.remove('drop-over'));

    const draggedId = e.dataTransfer.getData('text/plain');
    const destId = dest.dataset.id; if(!draggedId || draggedId===destId) return;

    const day = parentDay();
    const draggedIdx = day.exercises.findIndex(x=> x.id===draggedId);
    const destIdx = day.exercises.findIndex(x=> x.id===destId);
    if(draggedIdx<0 || destIdx<0) return;

    const destBP = destGroup.dataset.bodypart;
    day.exercises[draggedIdx].bodyPart = destBP;

    const destRect = dest.getBoundingClientRect();
    const before = (e.clientY < destRect.top + destRect.height/2);

    const item = day.exercises.splice(draggedIdx,1)[0];
    const newIndex = (draggedIdx < destIdx)
      ? (before ? destIdx-1 : destIdx)
      : (before ? destIdx : destIdx+1);

    day.exercises.splice(Math.max(0, Math.min(day.exercises.length, newIndex)), 0, item);
    saveDay(day); render();
  }, {capture:true});
}

  const params = new URLSearchParams(window.location.search);
